<body>
<div id="splash" class="splash" aria-live="polite">
  <div class="splash-in"><img class="splash-logo" src="icons/logo-splash.png" alt="Яна Pro"></div>
</div>
<script>
(function () {
  window.__splashStart = Date.now();
  var sp = document.getElementById("splash");
  sp.addEventListener("click", function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 650); });
  setTimeout(function () { sp.remove(); }, 9000);
})();
</script>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
