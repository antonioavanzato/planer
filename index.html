<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал Зала</title>
<meta name="theme-color" content="#f7f8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Журнал">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="splash" aria-live="polite">
  <div class="splash-in">
    <svg class="splash-ico" viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="12" y="22" width="6" height="20" rx="1.5"/><rect x="46" y="22" width="6" height="20" rx="1.5"/><rect x="6.5" y="26" width="4.5" height="12" rx="1.2"/><rect x="53" y="26" width="4.5" height="12" rx="1.2"/><rect x="18" y="30" width="28" height="4" rx="1"/></g></svg>
    <span class="splash-hi" id="splash-hi">Привет, Яна</span>
    <p class="splash-q" id="splash-q"></p>
    <span class="splash-tag">намерение дня</span>
  </div>
</div>
<script>
/* Фразы для Яны в духе «Трансерфинга»: намерение, важность, слайды, зеркало мира — про её работу тренером.
   Каждый запуск — новая фраза, без повтора предыдущей. */
(function () {
  var Q = [
    "Ты не тянешь клиента к результату. Ты задаёшь намерение, и путь к нему выстраивается сам.",
    "Каждая тренировка — это слайд. Держи в голове картинку, где клиент уже сильный.",
    "Дело не в весе на штанге. Дело в намерении, с которым ты её подаёшь.",
    "Снижай важность. Спокойный тренер ведёт дальше, чем тренер в напряжении.",
    "Мир — зеркало. Улыбнись залу, и зал ответит тебе тем же.",
    "Клиент приходит не за упражнениями, а за состоянием, которое ты создаёшь.",
    "Не борись с чужими сомнениями. Делай своё — и они отпустят сами.",
    "Выбирай не самую большую цель, а свою. Тогда двери открываются легко.",
    "Сегодняшний подход — шаг по той линии жизни, где у тебя всё получается.",
    "Энергия идёт туда, где внимание. Направь его на силу, а не на усталость.",
    "Не жди мотивации — будь ею. Клиенты настраиваются на твою волну.",
    "Разреши себе быть лучшим тренером в городе. Разрешение — половина пути.",
    "Прогресс любит спокойствие: плюс 2,5 кг сегодня лучше рывка и отката завтра.",
    "Твоё намерение сильнее любого расписания. Расписание просто его записывает.",
    "Отпусти идеальную тренировку. Живая всегда сильнее.",
    "Благодари каждый подход. Благодарность снимает лишнюю важность.",
    "Ты не уговариваешь клиентов. Ты показываешь дорогу, по которой уже идёшь.",
    "Тело слушает намерение. Скажи ему «могу» — и оно найдёт как.",
    "Не спорь с реальностью — настраивай её. Каждый день понемногу.",
    "Когда ты в потоке, нужные клиенты находят тебя сами.",
    "Сомнение — просто чужой маятник. Переключи внимание на то, что уже получилось.",
    "График прогресса — отражение твоей работы. Смотри, он тебе улыбается.",
    "Сила не в том, чтобы толкать, а в том, чтобы позволить.",
    "Начни день так, будто нужный клиент уже записался. Он запишется.",
    "Твоя уверенность — первый вес, который клиент берёт на себя.",
    "Не гонись за результатом. Иди к нему — и он выйдет навстречу.",
    "Каждый «последний подход» — это выбор линии, где клиент сильнее вчерашнего.",
    "Ты формируешь не только тела, но и веру людей в себя. Это и есть твоя сила."
  ];
  var last = -1, i;
  try { last = +localStorage.getItem("splash-q"); } catch (e) {}
  do { i = Math.floor(Math.random() * Q.length); } while (i === last && Q.length > 1);
  try { localStorage.setItem("splash-q", i); } catch (e) {}
  document.getElementById("splash-q").textContent = Q[i];
  var h = new Date().getHours();
  document.getElementById("splash-hi").textContent =
    h < 5 ? "Доброй ночи, Яна" : h < 12 ? "Доброе утро, Яна" : h < 18 ? "Добрый день, Яна" : "Добрый вечер, Яна";
  window.__splashStart = Date.now();
  var sp = document.getElementById("splash");
  sp.addEventListener("click", function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 650); });
  setTimeout(function () { sp.remove(); }, 9000);
})();
</script>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
