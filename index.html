<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Журнал Зала</title>
<meta name="theme-color" content="#f7f8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Журнал">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="splash" aria-live="polite">
  <div class="splash-in">
    <svg class="splash-ico" viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="12" y="22" width="6" height="20" rx="1.5"/><rect x="46" y="22" width="6" height="20" rx="1.5"/><rect x="6.5" y="26" width="4.5" height="12" rx="1.2"/><rect x="53" y="26" width="4.5" height="12" rx="1.2"/><rect x="18" y="30" width="28" height="4" rx="1"/></g></svg>
    <p class="splash-q" id="splash-q">Яна — ты лучшая</p>
  </div>
</div>
<script>
/* Короткая фраза для Яны: читается за секунду. Каждый запуск — другая, без повтора подряд. */
(function () {
  var Q = [
    "Яна — ты лучшая",
    "Яна — ты сила",
    "Ты вдохновляешь",
    "Сегодня твой день",
    "Всё получится",
    "Сильнее каждый день",
    "Яна — тренер №1"
  ];
  var last = -1, i;
  try { last = +localStorage.getItem("splash-q2"); } catch (e) {}
  do { i = Math.floor(Math.random() * Q.length); } while (i === last && Q.length > 1);
  try { localStorage.setItem("splash-q2", i); } catch (e) {}
  document.getElementById("splash-q").textContent = Q[i];
  window.__splashStart = Date.now();
  var sp = document.getElementById("splash");
  sp.addEventListener("click", function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 650); });
  setTimeout(function () { sp.remove(); }, 9000);
})();
</script>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
